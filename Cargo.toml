[workspace]
resolver = "3"
# Crates are added here as they get real code; the empty scaffold folders are
# intentionally not listed yet.
members = ["crates/brokers/dhan", "crates/core", "crates/costs", "crates/indicators", "crates/sim", "crates/store", "crates/strategies", "apps/tools"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
arc-swap = "1"
trading-core = { path = "crates/core" }
indicators = { path = "crates/indicators" }
costs = { path = "crates/costs" }
store = { path = "crates/store" }
sim = { path = "crates/sim" }
strategies = { path = "crates/strategies" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
csv = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
governor = "0.10"
# QuestDB client: QWP over WebSocket for ingestion (sender) and queries (reader).
questdb-rs = { version = "7.2.1", default-features = false, features = [
  "sync-sender-qwp-ws",
  "sync-reader-qwp-ws",
  "rust_decimal",
  "tls-webpki-certs",
  "ring-crypto",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
totp-rs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
zeroize = "1"

# Shared lint policy: the live trading path must never panic on bad input.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
