[package]
name = "tools"
version = "0.1.0"
description = "Command-line tools: daily data download, Dhan token, and the momentum rotation (study, paper account, plan)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "dhan-daily"
path = "src/bin/dhan_daily.rs"

[[bin]]
name = "dhan-token"
path = "src/bin/dhan_token.rs"

[[bin]]
name = "rotation-paper"
path = "src/bin/rotation_paper.rs"

[[bin]]
name = "rotation-plan"
path = "src/bin/rotation_plan.rs"

[[bin]]
name = "rotation-study"
path = "src/bin/rotation_study.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
dhan = { path = "../../crates/brokers/dhan" }
reqwest.workspace = true
rotation.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
tokio = { workspace = true, features = ["signal"] }
store.workspace = true

[lints]
workspace = true
