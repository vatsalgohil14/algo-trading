# QuestDB settings for local development.
# Copied to $QDB_ROOT/conf/server.conf on first start by scripts/questdb.sh.
# Anything not set here uses QuestDB's defaults.

# Listen on localhost only: the default PostgreSQL login (admin/quest) must
# never be reachable from the network.
http.bind.to=127.0.0.1:9000
http.min.net.bind.to=127.0.0.1:9003
pg.net.bind.to=127.0.0.1:8812
line.tcp.net.bind.to=127.0.0.1:9009

# Don't send usage telemetry.
telemetry.enabled=false

# Ingestion (QWP and ILP) must never create tables or columns: the schema is
# owned by deploy/questdb/schema.sql. A misspelled table or column name is
# rejected instead of silently creating junk.
line.auto.create.new.tables=false
line.auto.create.new.columns=false
